#Kotlin
kotlin.code.style=official
# Kotlin compiler daemon heap. Phone-friendly default; raise to 3072M on devices with 12 GB+ RAM.
kotlin.daemon.jvmargs=-Xmx2048M

#Gradle  (memory profile tuned for building on an Android phone with AndroidIDE)
# If the build dies with "OutOfMemoryError" / "Gradle daemon disappeared", lower these a little
# (e.g. -Xmx2560M / -Xmx1536M) or close other apps; on 12 GB+ phones you may raise them.
org.gradle.jvmargs=-Xmx3072M -XX:MaxMetaspaceSize=768M -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true
# Parallel module builds multiply memory use; keep it off on phones.
org.gradle.parallel=false
org.gradle.workers.max=2

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true

compose.desktop.packaging.checkJdkVendor=false
